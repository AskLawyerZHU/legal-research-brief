<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>图型模板 · 请求权基础图 / 结果分布图 / 时间轴 / 争点攻防图</title>
<!--
  用法：整段复制对应 <section> 进交付件，替换 {{}} 占位符，不要改坐标与字号。
  四张图的 viewBox 宽度统一 960，等比缩放不失真；自包含，不引用任何外部字体或脚本。
  布局硬约束见 references/visualization.md 第四节——改之前先读那七条。
  语义色固定四色：蓝=有利/成立、灰=待证/中性、琥珀=酌减/部分、红=不利/风险。
-->
<style>
  :root{
    --ink:#1f2937; --muted:#6b7280; --line:#cbd5e1;
    --ok:#2563eb;   --ok-bg:#eff6ff;
    --wait:#64748b; --wait-bg:#f8fafc;
    --part:#b45309; --part-bg:#fffbeb;
    --risk:#dc2626; --risk-bg:#fef2f2;
  }
  html,body{margin:0;padding:0;background:#fff;color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{padding:28px 24px 40px;max-width:1010px;margin:0 auto;}
  section{margin:0 0 44px;}
  h2{font-size:19px;margin:0 0 4px;letter-spacing:.3px;}
  .use{font-size:13px;color:var(--muted);margin:0 0 14px;line-height:1.7;}
  svg{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:10px;background:#fff;}
  text{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  @media print{
    .wrap{padding:0;}
    h2,.use{display:none;}
    section{margin:0;page-break-after:always;}
    svg{border:none;border-radius:0;}
    .card{box-shadow:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">

<!-- ================= 1. 请求权基础图 ================= -->
<section>
  <h2>① 请求权基础图</h2>
  <p class="use">用在：要主张什么、缺哪个要件就断。要件并列横排，缺的那个用虚线红框＋「断链点」标记；结论条只写已成立的要件链。</p>
  <svg viewBox="0 0 960 560" role="img" aria-label="请求权基础图">

      <marker id="ar1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
      </marker>
    </defs>

    <!-- 请求 -->
    <rect class="card" x="280" y="28" width="400" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>

    <text x="480" y="82" text-anchor="middle" font-size="13" fill="#6b7280">请求权基础：{{《法规名》第 X 条}}</text>

    <!-- 主干与总线 -->
    <line x1="480" y1="100" x2="480" y2="150" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar1)"/>
    <line x1="165" y1="150" x2="795" y2="150" stroke="#cbd5e1" stroke-width="1.6"/>

    <!-- 要件 1 -->

    <rect class="card" x="70" y="186" width="190" height="176" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>

    <text x="88" y="242" font-size="13" fill="#4b5563">依据：{{第 X 条}}</text>
    <text x="88" y="268" font-size="13" fill="#4b5563">{{状态：已具备}}</text>
    <text x="88" y="294" font-size="13" fill="#4b5563">{{举证：谁主张}}</text>
    <text x="88" y="330" font-size="13" font-weight="700" fill="#2563eb">成立</text>

    <!-- 要件 2 -->
    <line x1="375" y1="150" x2="375" y2="186" stroke="#cbd5e1" stroke-width="1.6"/>
    <rect class="card" x="280" y="186" width="190" height="176" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
    <text x="298" y="214" font-size="16" font-weight="700" fill="#1f2937">要件二 {{四字内}}</text>
    <text x="298" y="242" font-size="13" fill="#4b5563">依据：{{第 X 条}}</text>
    <text x="298" y="268" font-size="13" fill="#4b5563">{{状态：已具备}}</text>
    <text x="298" y="294" font-size="13" fill="#4b5563">{{举证：谁主张}}</text>

    <rect class="card" x="490" y="186" width="190" height="176" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="508" y="214" font-size="16" font-weight="700" fill="#1f2937">要件三 {{四字内}}</text>
    <text x="508" y="242" font-size="13" fill="#4b5563">依据：{{第 X 条}}</text>
    <text x="508" y="268" font-size="13" fill="#4b5563">{{状态：缺证据}}</text>
    <text x="508" y="294" font-size="13" fill="#4b5563">补证路径 ①…②…③…</text>
    <text x="508" y="330" font-size="13" font-weight="700" fill="#dc2626">断链点</text>

    <!-- 要件 4 -->
    <line x1="795" y1="150" x2="795" y2="186" stroke="#cbd5e1" stroke-width="1.6"/>
    <rect class="card" x="700" y="186" width="190" height="176" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
    <text x="718" y="214" font-size="16" font-weight="700" fill="#1f2937">要件四 {{四字内}}</text>
    <text x="718" y="242" font-size="13" fill="#4b5563">依据：{{第 X 条}}</text>
    <text x="718" y="268" font-size="13" fill="#4b5563">{{状态：已具备}}</text>
    <text x="718" y="294" font-size="13" fill="#4b5563">{{举证：谁主张}}</text>
    <text x="718" y="330" font-size="13" font-weight="700" fill="#2563eb">成立</text>

    <!-- 结论条 -->
    <rect class="card" x="70" y="390" width="820" height="62" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="88" y="416" font-size="15" font-weight="700" fill="#1f2937">结论：{{如要件三补齐则请求可支持；现缺该环，仅能主张……}}</text>
    <text x="88" y="438" font-size="13" fill="#6b7280">依据：{{《法规名》第 X 条}}（{{现行有效｜检索 2026-11-15}}）</text>

    <!-- 待核验 -->
    <rect class="card" x="70" y="472" width="820" height="60" rx="9" fill="#fffbeb" stroke="#b45309" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="88" y="496" font-size="14" font-weight="700" fill="#b45309">待核验</text>
    <text x="152" y="496" font-size="13" fill="#4b5563">{{哪几项没查到｜怎么核｜影响哪个要件}}</text>
    <text x="88" y="518" font-size="13" fill="#6b7280">本图不代表裁判结果，仅为要件缺口示意。〔检索日期 2026-11-15〕</text>
  </svg>
</section>

<!-- ================= 4. 争点攻防图 ================= -->
